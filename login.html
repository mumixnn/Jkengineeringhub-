<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | J&K Engineering Hub</title>

<style>
*{box-sizing:border-box}
:root{--blue:#5965ff;--purple:#9274ff}
body{
 margin:0;font-family:Arial,sans-serif;color:#fff;min-height:100vh;
 background:linear-gradient(135deg,#729df7,#a8a4ff 50%,#d8c9ff);
 display:flex;flex-direction:column;position:relative;overflow-x:hidden
}
body:before{
 content:"";position:fixed;inset:0;z-index:-2;
 background:
 radial-gradient(ellipse at 15% 15%,#c6d9ff 0,transparent 35%),
 radial-gradient(ellipse at 90% 70%,#8e9bff 0,transparent 40%),
 linear-gradient(135deg,#78a8f7,#b2a4ff 55%,#e1d2ff)
}
a{color:inherit;text-decoration:none}
header{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:17px;font-weight:800;line-height:1.5}
.brand span{color:#4d50e8}
.home-link{font-size:13px;padding:11px 16px;border:1px solid #ffffff70;border-radius:30px;background:#ffffff18}
main{flex:1;display:flex;justify-content:center;align-items:center;padding:24px 16px}
.card{
 width:100%;max-width:440px;padding:32px;border-radius:25px;
 background:#ffffff24;border:1px solid #ffffffa8;
 box-shadow:0 18px 55px #344b9a30,inset 0 1px 1px #ffffff90;
 backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)
}
.logo{
 width:58px;height:58px;display:grid;place-items:center;border-radius:18px;
 font-size:28px;margin-bottom:20px;background:linear-gradient(135deg,#80b7ff,#7964ff);
 border:1px solid #ffffffa0;box-shadow:0 8px 24px #5555ff45
}
h1{font-size:27px;margin:0 0 10px;letter-spacing:-.6px}
h1 span{color:#5559ff}
.subtitle{font-size:14px;color:#f4f5ff;line-height:1.6;margin:0 0 24px}
.tabs{display:flex;padding:5px;background:#ffffff28;border:1px solid #ffffff55;border-radius:13px;margin-bottom:22px}
.tabs button{flex:1;border:0;padding:12px 6px;background:transparent;border-radius:10px;font-weight:bold;color:#fff;cursor:pointer}
.tabs button.active{background:linear-gradient(110deg,#6b83ff,#7862ff);box-shadow:0 4px 15px #4c50db45}
label{display:block;font-size:13px;font-weight:bold;margin:15px 0 8px}
input{
 width:100%;padding:14px;border:1px solid #ffffff90;border-radius:11px;
 background:#ffffff20;color:#fff;font-size:14px;outline:none
}
input::placeholder{color:#f0f2ff}
input:focus{border-color:#fff;box-shadow:0 0 0 3px #ffffff25}
.password{display:flex;gap:8px}
.password input{flex:1;min-width:0}
.password button{border:1px solid #ffffff80;background:#ffffff20;color:#fff;border-radius:11px;padding:0 13px;cursor:pointer}
.forgot{text-align:right;margin-top:11px;font-size:12px}
.forgot a{color:#f4f4ff}
.submit{
 width:100%;margin-top:22px;padding:15px;border:1px solid #ffffff90;
 border-radius:12px;background:linear-gradient(110deg,#687dff,#7960ff);
 color:white;font-size:14px;font-weight:bold;cursor:pointer;
 box-shadow:0 7px 18px #4f50dd40
}
.submit:hover{filter:brightness(1.07)}
.divider{display:flex;align-items:center;gap:12px;margin:21px 0;color:#f3f3ff;font-size:12px}
.divider:before,.divider:after{content:"";height:1px;background:#ffffff80;flex:1}
.google{width:100%;padding:13px;background:#ffffff20;color:white;border:1px solid #ffffff80;border-radius:11px;font-weight:bold;cursor:pointer}
.message{display:none;background:#ffffff30;border:1px solid #ffffff60;color:white;padding:12px;border-radius:10px;font-size:13px;line-height:1.5;margin-top:14px;overflow-wrap:anywhere}
.terms{font-size:11px;line-height:1.7;color:#f3f3ff;text-align:center;margin:20px 0 0}
footer{text-align:center;padding:20px;font-size:12px;color:#f3f3ff}
@media(max-width:480px){.card{padding:25px 20px}header{padding:17px 5%}h1{font-size:25px}}
</style>
</head>

<body>
<header>
 <a class="brand" href="index.html">J&K <span>ENGINEERING</span><br>HUB 🎓</a>
 <a class="home-link" href="index.html">← Back to home</a>
</header>

<main>
<section class="card">
 <div class="logo">🎓</div>
 <h1 id="heading">Welcome <span>back!</span></h1>
 <p class="subtitle" id="subtitle">Sign in to access your engineering study space.</p>

 <div class="tabs">
  <button class="active" id="loginTab" type="button" onclick="setMode('login')">Login</button>
  <button id="signupTab" type="button" onclick="setMode('signup')">Create account</button>
 </div>

 <form id="authForm">
  <div id="nameField" style="display:none">
   <label for="name">Full name</label>
   <input id="name" type="text" autocomplete="name" placeholder="Enter your full name">
  </div>

  <label for="email">Email address</label>
  <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>

  <label for="password">Password</label>
  <div class="password">
   <input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="At least 6 characters" required>
   <button type="button" id="eye" onclick="togglePassword()">Show</button>
  </div>

  <div class="forgot" id="forgot">
   <a href="#" onclick="forgotPassword(event)">Forgot password?</a>
  </div>

  <button class="submit" type="submit" id="submitBtn">Login to your account →</button>
  <div class="message" id="message" role="status"></div>
 </form>

 <div class="divider">OR</div>
 <button class="google" type="button" onclick="showMessage('Google login is unavailable in this demo.')">🌐 Continue with Google</button>

 <p class="terms">This is a demonstration login page. Accounts are not created or verified, and passwords are not saved.</p>
</section>
</main>

<footer>© J&K Engineering Hub · Learn. Share. Grow.</footer>

<script>
let mode = "login";

function setMode(nextMode){
 mode = nextMode;
 const signup = mode === "signup";

 document.getElementById("heading").innerHTML = signup
  ? "Join our <span>community</span>" : "Welcome <span>back!</span>";

 document.getElementById("subtitle").textContent = signup
  ? "Create your student account to get started."
  : "Sign in to access your engineering study space.";

 document.getElementById("nameField").style.display = signup ? "block" : "none";
 document.getElementById("name").required = signup;
 document.getElementById("loginTab").classList.toggle("active",!signup);
 document.getElementById("signupTab").classList.toggle("active",signup);
 document.getElementById("forgot").style.display = signup ? "none" : "block";
 document.getElementById("submitBtn").textContent = signup
  ? "Create my account →" : "Login to your account →";
 document.getElementById("password").autocomplete = signup ? "new-password" : "current-password";
 document.getElementById("message").style.display = "none";
}

function togglePassword(){
 const input = document.getElementById("password");
 const visible = input.type === "password";
 input.type = visible ? "text" : "password";
 document.getElementById("eye").textContent = visible ? "Hide" : "Show";
}

function showMessage(text){
 const box = document.getElementById("message");
 box.textContent = text;
 box.style.display = "block";
}

document.getElementById("authForm").addEventListener("submit",function(event){
 event.preventDefault();
 if(!this.reportValidity()) return;

 showMessage(mode === "signup"
  ? "Demo only: no account was created. Real account registration requires a backend."
  : "Demo only: your identity has not been verified. No login session was created.");
});

function forgotPassword(event){
 event.preventDefault();
 showMessage("Password reset is unavailable because this demo has no authentication backend.");
}
</script>
</body>
</html>

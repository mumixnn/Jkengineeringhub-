
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#dbeafe">
<title>Login | J&K Engineering Hub</title>

<style>
*{box-sizing:border-box}

:root{
  --blue:#4776f5;
  --purple:#8b5cf6;
  --ink:#20264a;
  --muted:#687493;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse at 12% 18%,#a5c8ffb8,transparent 42%),
    radial-gradient(ellipse at 88% 25%,#d7baffbd,transparent 42%),
    radial-gradient(ellipse at 50% 100%,#b9d5ff,transparent 48%),
    linear-gradient(135deg,#edf5ff,#f3edff 55%,#e6efff);
  background-attachment:fixed;
}

a{color:#4169e8;text-decoration:none}

header{
  padding:22px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.brand{
  font-size:17px;
  font-weight:800;
  line-height:1.5;
  color:#29375d;
  letter-spacing:.3px;
}

.brand span{
  background:linear-gradient(90deg,#4776f5,#9560e9);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

header>a:last-child{
  font-size:13px;
  font-weight:bold;
  color:#53628c;
}

main{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:28px 16px 40px;
}

.card{
  width:100%;
  max-width:445px;
  padding:34px;
  border:1px solid #ffffffc9;
  border-radius:26px;
  background:rgba(255,255,255,.48);
  box-shadow:
    0 24px 70px #5868a51c,
    inset 0 1px 0 #ffffffd9;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  animation:appear .55s ease both;
}

@keyframes appear{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

.logo{
  width:59px;
  height:59px;
  display:grid;
  place-items:center;
  margin-bottom:22px;
  border:1px solid #ffffffd9;
  border-radius:19px;
  background:linear-gradient(135deg,#ffffffd9,#d9e4ffb8);
  box-shadow:0 8px 25px #7289ef24;
  font-size:29px;
}

h1{
  margin:0 0 10px;
  font-size:27px;
  letter-spacing:-.6px;
}

.subtitle{
  margin:0 0 25px;
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

.tabs{
  display:flex;
  padding:5px;
  margin-bottom:23px;
  border:1px solid #ffffffc7;
  border-radius:13px;
  background:#e8edff99;
}

.tabs button{
  flex:1;
  padding:12px 8px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#697493;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.tabs button.active{
  color:#4168e8;
  background:#ffffffdc;
  box-shadow:0 3px 12px #5968a51c;
}

label{
  display:block;
  margin:16px 0 8px;
  color:#35405f;
  font-size:13px;
  font-weight:bold;
}

input{
  width:100%;
  min-width:0;
  padding:14px;
  border:1px solid #cfd8efb8;
  border-radius:12px;
  outline:none;
  background:#ffffffa6;
  color:#242d4b;
  font-size:14px;
  transition:.2s;
}

input::placeholder{color:#9aa4bc}

input:focus{
  border-color:#8299ff;
  background:#ffffffdf;
  box-shadow:0 0 0 4px #8299ff20;
}

.password{
  display:flex;
  gap:8px;
}

.password input{flex:1}

.password button{
  padding:0 13px;
  border:1px solid #cfd8efb8;
  border-radius:12px;
  background:#ffffffa6;
  color:#5268b7;
  font-weight:bold;
  cursor:pointer;
}

.forgot{
  margin-top:12px;
  text-align:right;
  font-size:12px;
  font-weight:bold;
}

.forgot a:hover{text-decoration:underline}

.submit{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:linear-gradient(110deg,#4776f5,#795ce8 65%,#9a65e9);
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 9px 22px #6a68e63b;
  transition:transform .2s,box-shadow .2s;
}

.submit:hover{
  transform:translateY(-1px);
  box-shadow:0 12px 27px #6a68e650;
}

.submit:disabled,.google:disabled{
  opacity:.65;
  cursor:wait;
  transform:none;
}

.divider{
  display:flex;
  align-items:center;
  gap:13px;
  margin:22px 0;
  color:#8791ac;
  font-size:11px;
  font-weight:bold;
}

.divider:before,.divider:after{
  content:"";
  height:1px;
  flex:1;
  background:#b9c5e477;
}

.google{
  width:100%;
  padding:13px;
  border:1px solid #ffffffdc;
  border-radius:12px;
  background:#ffffffa8;
  color:#39435e;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.google:hover{background:#ffffffed}

.message{
  display:none;
  padding:12px;
  margin-top:15px;
  border:1px solid transparent;
  border-radius:11px;
  font-size:13px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.message.error{
  display:block;
  color:#a52e51;
  background:#fff0f4dc;
  border-color:#ffd5e0;
}

.message.success{
  display:block;
  color:#176b51;
  background:#e9fff5dc;
  border-color:#c1f1df;
}

.message.info{
  display:block;
  color:#3859a7;
  background:#edf3ffdc;
  border-color:#d6e2ff;
}

.terms{
  margin:19px 0 0;
  color:#7b86a2;
  text-align:center;
  font-size:11px;
  line-height:1.8;
}

footer{
  padding:18px;
  color:#7885a3;
  text-align:center;
  font-size:12px;
}

@media(max-width:480px){
  header{padding:18px 5%}
  .brand{font-size:15px}
  header>a:last-child{font-size:12px}
  main{padding:20px 14px 30px}
  .card{padding:27px 21px;border-radius:23px}
  h1{font-size:25px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>
<header>
  <a class="brand" href="index.html">
    J&amp;K <span>ENGINEERING</span><br>HUB 🎓
  </a>
  <a href="index.html">← Back to home</a>
</header>

<main>
<section class="card">
  <div class="logo">🎓</div>

  <h1 id="heading">Welcome back!</h1>
  <p class="subtitle" id="subtitle">
    Sign in to access your engineering study space.
  </p>

  <div class="tabs">
    <button class="active" id="loginTab" type="button">Login</button>
    <button id="signupTab" type="button">Create account</button>
  </div>

  <form id="authForm">
    <div id="nameField" hidden>
      <label for="name">Full name</label>
      <input id="name" type="text" autocomplete="name"
             placeholder="Enter your full name" maxlength="100">
    </div>

    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="email"
           placeholder="you@example.com" required>

    <label for="password">Password</label>
    <div class="password">
      <input id="password" type="password"
             autocomplete="current-password"
             minlength="6" placeholder="At least 6 characters"
             required>
      <button type="button" id="eye">Show</button>
    </div>

    <div id="forgot" class="forgot">
      <a href="#" id="forgotLink">Forgot password?</a>
    </div>

    <button class="submit" type="submit" id="submitBtn">
      Login to your account →
    </button>

    <div class="message" id="message" role="status"
         aria-live="polite"></div>
  </form>

  <div class="divider">OR</div>

  <button class="google" id="googleBtn" type="button">
    🌐 Continue with Google
  </button>

  <p class="terms">
    Your account helps you access J&amp;K Engineering Hub.
    Keep your login details private.
  </p>
</section>
</main>

<footer>© J&amp;K Engineering Hub · Learn. Share. Grow.</footer>

<script type="module">
import { auth, db } from "./firebase.js";

import {
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile,
  sendPasswordResetEmail,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const $ = id => document.getElementById(id);

let mode = "login";

function showMessage(text, type = "error") {
  const box = $("message");
  box.textContent = text;
  box.className = "message " + type;
}

function clearMessage() {
  $("message").textContent = "";
  $("message").className = "message";
}

function setMode(nextMode) {
  mode = nextMode;
  const signup = mode === "signup";

  $("heading").textContent = signup
    ? "Join our community" : "Welcome back!";

  $("subtitle").textContent = signup
    ? "Create your student account to get started."
    : "Sign in to access your engineering study space.";

  $("nameField").hidden = !signup;
  $("name").required = signup;
  $("loginTab").classList.toggle("active", !signup);
  $("signupTab").classList.toggle("active", signup);
  $("forgot").hidden = signup;

  $("submitBtn").textContent = signup
    ? "Create my account →" : "Login to your account →";

  $("password").autocomplete = signup
    ? "new-password" : "current-password";

  clearMessage();
}

$("loginTab").addEventListener("click", () => setMode("login"));
$("signupTab").addEventListener("click", () => setMode("signup"));

$("eye").addEventListener("click", () => {
  const input = $("password");
  const visible = input.type === "password";
  input.type = visible ? "text" : "password";
  $("eye").textContent = visible ? "Hide" : "Show";
  $("eye").setAttribute("aria-label",
    visible ? "Hide password" : "Show password");
});

function friendlyError(error) {
  const code = error?.code || "";

  const messages = {
    "auth/invalid-email": "Please enter a valid email address.",
    "auth/user-disabled": "This account has been disabled.",
    "auth/user-not-found": "No account found. Create an account first.",
    "auth/wrong-password": "Incorrect email or password.",
    "auth/invalid-credential": "Incorrect email or password.",
    "auth/email-already-in-use": "An account with this email already exists. Try logging in.",
    "auth/weak-password": "Choose a stronger password with at least 6 characters.",
    "auth/too-many-requests": "Too many attempts. Please wait and try again.",
    "auth/network-request-failed": "Network problem. Check your internet connection.",
    "auth/popup-closed-by-user": "Google sign-in was closed before completion.",
    "auth/operation-not-allowed": "This sign-in method is not enabled in Firebase Console.",
    "auth/unauthorized-domain": "Add your website domain under Firebase Authentication settings.",
    "permission-denied": "Database access was denied. Firebase Firestore rules need to be configured securely."
  };

  return messages[code] ||
    "Something went wrong. Please try again. (" + code + ")";
}

function setLoading(loading) {
  $("submitBtn").disabled = loading;
  $("googleBtn").disabled = loading;

  if (loading) {
    $("submitBtn").textContent = "Please wait…";
  } else {
    $("submitBtn").textContent = mode === "signup"
      ? "Create my account →" : "Login to your account →";
  }
}

async function saveUserProfile(user, fullName = "") {
  // A database failure should not invalidate successful authentication.
  // Firestore rules must allow users to write only their own profile.
  try {
    await setDoc(doc(db, "users", user.uid), {
      uid: user.uid,
      email: user.email || "",
      displayName: fullName || user.displayName || "",
      updatedAt: serverTimestamp()
    }, { merge: true });
  } catch (error) {
    console.error("Profile save failed:", error);
    showMessage(
      "Your account is signed in, but your profile could not be saved. Database rules may need configuration.",
      "info"
    );
  }
}

function goAfterLogin() {
  // Change this only if your actual post-login page has another filename.
  window.location.href = "profile.html";
}

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage();

  if (!$("authForm").reportValidity()) return;

  const email = $("email").value.trim();
  const password = $("password").value;
  const fullName = $("name").value.trim();

  if (mode === "signup" && !fullName) {
    showMessage("Please enter your full name.");
    $("name").focus();
    return;
  }

  setLoading(true);

  try {
    if (mode === "signup") {
      const credential = await createUserWithEmailAndPassword(
        auth, email, password
      );

      await updateProfile(credential.user, {
        displayName: fullName
      });

      await saveUserProfile(credential.user, fullName);

      showMessage("Account created successfully! Opening your profile…", "success");
    } else {
      const credential = await signInWithEmailAndPassword(
        auth, email, password
      );

      await saveUserProfile(credential.user);

      showMessage("Login successful! Opening your profile…", "success");
    }

    setTimeout(goAfterLogin, 700);
  } catch (error) {
    console.error("Authentication error:", error);
    showMessage(friendlyError(error));
    setLoading(false);
  }
});

$("forgotLink").addEventListener("click", async event => {
  event.preventDefault();
  clearMessage();

  const email = $("email").value.trim();

  if (!email) {
    showMessage("Enter your email address above first.", "info");
    $("email").focus();
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showMessage(
      "If an account exists for this email, a password-reset email will be sent. Check your inbox and spam folder.",
      "success"
    );
  } catch (error) {
    showMessage(friendlyError(error));
  }
});

$("googleBtn").addEventListener("click", async () => {
  clearMessage();
  setLoading(true);

  try {
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);

    await saveUserProfile(result.user);
    showMessage("Google sign-in successful! Opening your profile…", "success");
    setTimeout(goAfterLogin, 700);
  } catch (error) {
    console.error("Google sign-in error:", error);
    showMessage(friendlyError(error));
    setLoading(false);
  }
});
</script>
</body>
</html>

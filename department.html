<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Department | J&K Engineering Hub</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(135deg,#06152f,#075985,#0891b2);
}
header,.panel{
  max-width:900px;
  margin:15px auto;
  padding:22px;
  border:1px solid #ffffff40;
  border-radius:20px;
  background:#ffffff15;
  backdrop-filter:blur(12px);
}
a{color:#bae6fd;text-decoration:none}
a:hover{text-decoration:underline}
.toplinks{display:flex;gap:18px;flex-wrap:wrap}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
  margin-top:20px;
}
.semester{
  padding:18px;
  border:1px solid #ffffff35;
  border-radius:16px;
  background:#ffffff12;
}
.semester h3{margin-top:0}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:15px;
}
.btn{
  display:inline-block;
  padding:10px 12px;
  border-radius:10px;
  background:#38bdf8;
  color:#06213b;
  font-weight:bold;
}
.secondary{
  background:#e0f2fe;
  color:#075985;
}
footer{text-align:center;margin:25px 0;color:#dbeafe}
</style>
</head>

<body>

<header>
  <div class="toplinks">
    <a href="index.html">← Home</a>
    <a id="allSyllabus" href="syllabus.html">📘 View Department Syllabus</a>
  </div>

  <h1 id="departmentTitle">Engineering Department</h1>
  <p>Choose your semester to explore study materials.</p>
</header>

<main class="panel">
  <h2>📚 Select Semester</h2>
  <div id="semesterGrid" class="grid"></div>
</main>

<footer>
  © 2026 J&K Engineering Hub
</footer>

<script>
const departments = {
  CE: "Computer Engineering",
  AI: "Artificial Intelligence",
  EC: "Electronics & Communication",
  IT: "Information Technology",
  CYBER: "Cyber Security",
  CIVIL: "Civil Engineering",
  ME: "Mechanical Engineering"
};

const params = new URLSearchParams(window.location.search);
const dept = params.get("dept") || "CE";
const departmentName = departments[dept] || departments.CE;

document.title = departmentName + " | J&K Engineering Hub";
document.getElementById("departmentTitle").textContent = departmentName;
document.getElementById("allSyllabus").href =
  "syllabus.html?dept=" + encodeURIComponent(dept);

const grid = document.getElementById("semesterGrid");

for (let sem = 1; sem <= 8; sem++) {
  const card = document.createElement("section");
  card.className = "semester";

  const heading = document.createElement("h3");
  heading.textContent = "Semester " + sem;

  const description = document.createElement("p");
  description.textContent =
    "Notes, presentations, question papers and study resources.";

  const actions = document.createElement("div");
  actions.className = "actions";

  const resourcesLink = document.createElement("a");
  resourcesLink.className = "btn";
  resourcesLink.href =
    "resources.html?dept=" + encodeURIComponent(dept) + "&sem=" + sem;
  resourcesLink.textContent = "Open Resources";

  const syllabusLink = document.createElement("a");
  syllabusLink.className = "btn secondary";
  syllabusLink.href =
    "syllabus.html?dept=" + encodeURIComponent(dept);
  syllabusLink.textContent = "View Syllabus";

  actions.append(resourcesLink, syllabusLink);
  card.append(heading, description, actions);
  grid.appendChild(card);
}
</script>

</body>
</html>

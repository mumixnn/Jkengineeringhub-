<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Department | J&K Engineering Hub</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #15304a;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top left, #9ce8f5, transparent 45%),
        radial-gradient(ellipse at bottom right, #bbcaff, transparent 45%),
        linear-gradient(135deg, #eafaff, #f4f0ff);
    }

    header {
      padding: 22px;
      text-align: center;
      border-radius: 20px;
      background: rgba(13, 48, 77, .88);
      color: white;
    }

    header h1 { margin: 0 0 8px; font-size: 25px; }

    a { color: inherit; }

    .back {
      display: inline-block;
      margin: 18px 0;
      color: #075985;
      text-decoration: none;
      font-weight: bold;
    }

    .intro { text-align: center; margin: 25px 0; }

    .intro h2 { margin-bottom: 8px; }

    .semesters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 15px;
      max-width: 850px;
      margin: auto;
    }

    .semester {
      display: block;
      padding: 24px 10px;
      text-align: center;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 18px;
      background: rgba(255,255,255,.58);
      box-shadow: 0 8px 25px rgba(30,70,110,.1);
      backdrop-filter: blur(12px);
      transition: transform .2s;
    }

    .semester:hover { transform: translateY(-4px); }

    .semester span {
      display: block;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .semester strong { font-size: 16px; }

    .semester small {
      display: block;
      margin-top: 8px;
      color: #506980;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #52677c;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>📘 J&K Engineering Hub</h1>
    <p>Learn • Share • Succeed</p>
  </header>

  <a class="back" href="index.html">← Back to Home</a>

  <section class="intro">
    <h2 id="departmentName">Engineering Department</h2>
    <p>Select your semester to explore study resources.</p>
  </section>

  <main class="semesters" id="semesters"></main>

  <footer>© 2026 J&K Engineering Hub</footer>

  <script>
    const departments = {
      CE: "Computer Engineering",
      AI: "Artificial Intelligence",
      EC: "Electronics & Communication",
      IT: "Information Technology",
      CYBER: "Cyber Security",
      CIVIL: "Civil Engineering",
      ME: "Mechanical Engineering"
    };

    const params = new URLSearchParams(location.search);
    const code = (params.get("dept") || "CE").toUpperCase();
    const department = departments[code] || departments.CE;

    document.title = department + " | J&K Engineering Hub";
    document.getElementById("departmentName").textContent = department;

    const container = document.getElementById("semesters");

    for (let i = 1; i <= 8; i++) {
      const card = document.createElement("a");
      card.className = "semester";
      card.href = "resources.html?dept=" + encodeURIComponent(code)
        + "&sem=" + i;

      const icon = document.createElement("span");
      icon.textContent = "📚";

      const title = document.createElement("strong");
      title.textContent = "Semester " + i;

      const detail = document.createElement("small");
      detail.textContent = "Notes & syllabus";

      card.append(icon, title, detail);
      container.appendChild(card);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | J&K Engineering Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #24304b;
      background: linear-gradient(135deg, #e4efff, #f4eaff);
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border: 1px solid #ffffff;
      border-radius: 24px;
      background: rgba(255,255,255,.85);
      box-shadow: 0 15px 45px #6577a522;
    }
    .logo {
      display: inline-grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 15px;
      color: white;
      font-weight: bold;
      background: linear-gradient(135deg, #6487ef, #a18bfa);
    }
    h1 { margin-bottom: 8px; }
    p { color: #74809a; line-height: 1.6; }
    .notice {
      margin: 20px 0;
      padding: 14px;
      border-radius: 12px;
      background: #fff5dc;
      color: #795b19;
      font-size: 14px;
      line-height: 1.5;
    }
    a.button {
      display: block;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      color: white;
      background: #6487ef;
      font-weight: bold;
    }
    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #5269bd;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">J&K</div>
    <p>ENGINEERING HUB · ADMIN</p>
    <h1>Welcome, Admin</h1>
    <p>Manage notes, students, reports and departments.</p>

    <div class="notice">
      <strong>Setup in progress</strong><br>
      Firebase security and admin login will be connected later.
      This is not a secure login yet.
    </div>

    <a class="button" href="admin.html">Open Admin Dashboard</a>
    <a class="back" href="index.html">← Back to Homepage</a>
  </main>
</body>
</html>

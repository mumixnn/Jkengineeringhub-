<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syllabus | J&K Engineering Hub</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:18px;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(135deg,#06152f,#075985,#0891b2);
}

header,.panel{
  max-width:900px;
  margin:15px auto;
  padding:22px;
  border:1px solid #ffffff40;
  border-radius:20px;
  background:#ffffff15;
  backdrop-filter:blur(12px);
}

a{color:#bae6fd;text-decoration:none}
a:hover{text-decoration:underline}

.toplinks{
  display:flex;
  flex-wrap:wrap;
  gap:16px;
}

select,button{
  width:100%;
  padding:12px;
  border:1px solid #ffffff40;
  border-radius:10px;
  font-size:15px;
}

select{
  background:#fff;
  color:#10233d;
  margin:8px 0;
}

button{
  background:#38bdf8;
  color:#06213b;
  font-weight:bold;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
  margin-top:20px;
}

.card{
  padding:18px;
  border:1px solid #ffffff35;
  border-radius:16px;
  background:#ffffff12;
}

.card h3{margin-top:0}

.btn{
  display:inline-block;
  margin-top:10px;
  padding:10px 13px;
  border-radius:9px;
  background:#38bdf8;
  color:#06213b;
  font-weight:bold;
}

.note{
  color:#dbeafe;
  font-size:14px;
  line-height:1.6;
}

footer{
  text-align:center;
  padding:20px;
  color:#dbeafe;
}
</style>
</head>

<body>

<header>
  <div class="toplinks">
    <a href="index.html">← Home</a>
    <a id="departmentLink" href="department.html">← Department</a>
    <a id="resourcesTopLink" href="resources.html">📚 Study Resources</a>
  </div>

  <h1>📘 Engineering Syllabus</h1>
  <p>J&K Engineering Hub</p>

  <label for="department"><strong>Select Department</strong></label>
  <select id="department">
    <option value="CE">Computer Engineering</option>
    <option value="AI">Artificial Intelligence</option>
    <option value="EC">Electronics & Communication</option>
    <option value="IT">Information Technology</option>
    <option value="CYBER">Cyber Security</option>
    <option value="CIVIL">Civil Engineering</option>
    <option value="ME">Mechanical Engineering</option>
  </select>

  <label for="semester"><strong>Select Semester</strong></label>
  <select id="semester">
    <option value="1">Semester 1</option>
    <option value="2">Semester 2</option>
    <option value="3">Semester 3</option>
    <option value="4">Semester 4</option>
    <option value="5">Semester 5</option>
    <option value="6">Semester 6</option>
    <option value="7">Semester 7</option>
    <option value="8">Semester 8</option>
  </select>

  <button id="openResources" type="button">
    Open Resources for This Semester →
  </button>
</header>

<main class="panel">
  <h2 id="pageTitle">Semester Syllabus</h2>

  <p class="note">
    Select your department and semester. You can open study resources
    for the same selection using the button above or the links below.
  </p>

  <div id="semesterGrid" class="grid"></div>
</main>

<footer>
  © 2026 J&K Engineering Hub
</footer>

<script>
const departments = {
  CE: "Computer Engineering",
  AI: "Artificial Intelligence",
  EC: "Electronics & Communication",
  IT: "Information Technology",
  CYBER: "Cyber Security",
  CIVIL: "Civil Engineering",
  ME: "Mechanical Engineering"
};

const department = document.getElementById("department");
const semester = document.getElementById("semester");
const semesterGrid = document.getElementById("semesterGrid");

function resourcesURL(dept, sem){
  return "resources.html?dept=" +
    encodeURIComponent(dept) + "&sem=" +
    encodeURIComponent(sem);
}

function updatePage(){
  const dept = department.value;
  const sem = semester.value;

  document.getElementById("pageTitle").textContent =
    departments[dept] + " — Semester " + sem + " Syllabus";

  document.getElementById("departmentLink").href =
    "department.html?dept=" + encodeURIComponent(dept);

  document.getElementById("resourcesTopLink").href =
    resourcesURL(dept, sem);

  semesterGrid.replaceChildren();

  for(let i = 1; i <= 8; i++){
    const card = document.createElement("section");
    card.className = "card";

    const heading = document.createElement("h3");
    heading.textContent = "Semester " + i;

    const description = document.createElement("p");
    description.className = "note";
    description.textContent =
      "View study materials and syllabus resources for " +
      departments[dept] + ", Semester " + i + ".";

    const link = document.createElement("a");
    link.className = "btn";
    link.href = resourcesURL(dept, i);
    link.textContent = "Open Semester " + i + " Resources →";

    card.append(heading, description, link);

    if(String(i) === sem){
      card.style.border = "2px solid #7dd3fc";
    }

    semesterGrid.appendChild(card);
  }
}

document.getElementById("openResources").addEventListener("click", () => {
  window.location.href = resourcesURL(department.value, semester.value);
});

department.addEventListener("change", updatePage);
semester.addEventListener("change", updatePage);

const params = new URLSearchParams(window.location.search);
const initialDept = params.get("dept");
const initialSem = Number(params.get("sem"));

if(departments[initialDept]){
  department.value = initialDept;
}

if(initialSem >= 1 && initialSem <= 8){
  semester.value = String(initialSem);
}

updatePage();
</script>

</body>
</html>

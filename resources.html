<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Resources | J&K Engineering Hub</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:18px;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(135deg,#06152f,#075985,#0891b2);
}

header,.panel{
  max-width:950px;
  margin:15px auto;
  padding:22px;
  border:1px solid #ffffff40;
  border-radius:20px;
  background:#ffffff15;
  backdrop-filter:blur(12px);
}

a{color:#bae6fd}
.toplinks{display:flex;flex-wrap:wrap;gap:16px}

.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px;
  margin-top:15px;
}

input,select,button{
  width:100%;
  padding:12px;
  border:1px solid #ffffff40;
  border-radius:10px;
  font-size:15px;
}

input,select{background:#fff;color:#10233d}

button{
  background:#38bdf8;
  color:#06213b;
  font-weight:bold;
  cursor:pointer;
}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:18px 0;
}

.tabs button{width:auto}
.tabs button.active{background:#fff}

.resource{
  padding:17px;
  margin:12px 0;
  border:1px solid #ffffff30;
  border-radius:15px;
  background:#ffffff12;
  overflow-wrap:anywhere;
}

.resource h3{margin-top:0}
.meta{color:#dbeafe;font-size:13px}

.download{
  display:inline-block;
  margin:8px 8px 0 0;
  padding:10px 14px;
  background:#38bdf8;
  color:#06213b;
  border-radius:9px;
  text-decoration:none;
  font-weight:bold;
}

.empty{
  padding:20px;
  text-align:center;
  color:#dbeafe;
}

footer{text-align:center;padding:20px;color:#dbeafe}
</style>
</head>

<body>

<header>
  <div class="toplinks">
    <a href="index.html">← Home</a>
    <a id="departmentLink" href="department.html">← Department</a>
    <a id="syllabusLink" href="syllabus.html">📘 View Syllabus</a>
  </div>

  <h1>📚 Study Resources</h1>
  <p>J&K Engineering Hub — Learn, Share and Grow.</p>

  <div class="controls">
    <select id="department" aria-label="Select department">
      <option value="CE">Computer Engineering</option>
      <option value="AI">Artificial Intelligence</option>
      <option value="EC">Electronics & Communication</option>
      <option value="IT">Information Technology</option>
      <option value="CYBER">Cyber Security</option>
      <option value="CIVIL">Civil Engineering</option>
      <option value="ME">Mechanical Engineering</option>
    </select>

    <select id="semester" aria-label="Select semester">
      <option value="1">Semester 1</option>
      <option value="2">Semester 2</option>
      <option value="3">Semester 3</option>
      <option value="4">Semester 4</option>
      <option value="5">Semester 5</option>
      <option value="6">Semester 6</option>
      <option value="7">Semester 7</option>
      <option value="8">Semester 8</option>
    </select>
  </div>

  <div class="controls">
    <input id="search" type="search"
      placeholder="Search notes, subjects or papers...">
    <button id="searchButton" type="button">Search Resources</button>
  </div>
</header>

<main class="panel">
  <h2 id="pageTitle">Semester Resources</h2>

  <div class="tabs" id="categoryTabs">
    <button class="active" data-category="All">All</button>
    <button data-category="Notes">Notes</button>
    <button data-category="PPT">PPTs</button>
    <button data-category="Question Papers">Question Papers</button>
    <button data-category="Syllabus">Syllabus</button>
  </div>

  <div id="resourceList" aria-live="polite"></div>
</main>

<footer>
  © 2026 J&K Engineering Hub
</footer>

<script>
const departments = {
  CE: "Computer Engineering",
  AI: "Artificial Intelligence",
  EC: "Electronics & Communication",
  IT: "Information Technology",
  CYBER: "Cyber Security",
  CIVIL: "Civil Engineering",
  ME: "Mechanical Engineering"
};

/*
  Add real resource entries here.
  Replace url with a publicly accessible PDF or file URL.
  Empty URLs are intentionally treated as unavailable.
*/
const resources = [
  {
    dept: "CE",
    sem: 3,
    subject: "Database Management System",
    title: "DBMS Study Notes",
    category: "Notes",
    type: "PDF",
    url: ""
  },
  {
    dept: "CE",
    sem: 3,
    subject: "Java Programming",
    title: "Java Programming Presentation",
    category: "PPT",
    type: "PPT",
    url: ""
  },
  {
    dept: "CE",
    sem: 3,
    subject: "Data Structures",
    title: "Previous Year Question Paper",
    category: "Question Papers",
    type: "PDF",
    url: ""
  }
];

const departmentSelect = document.getElementById("department");
const semesterSelect = document.getElementById("semester");
const searchInput = document.getElementById("search");
const resourceList = document.getElementById("resourceList");

let selectedCategory = "All";

function updateLinks(){
  const dept = departmentSelect.value;
  const sem = semesterSelect.value;

  document.getElementById("departmentLink").href =
    "department.html?dept=" + encodeURIComponent(dept);

  document.getElementById("syllabusLink").href =
    "syllabus.html?dept=" + encodeURIComponent(dept) +
    "&sem=" + encodeURIComponent(sem);
}

function createText(tag, text, className){
  const element = document.createElement(tag);
  element.textContent = text;

  if(className){
    element.className = className;
  }

  return element;
}

function showResources(){
  const dept = departmentSelect.value;
  const sem = Number(semesterSelect.value);
  const query = searchInput.value.trim().toLowerCase();

  updateLinks();

  document.getElementById("pageTitle").textContent =
    departments[dept] + " — Semester " + sem;

  resourceList.replaceChildren();

  const filtered = resources.filter(r =>
    r.dept === dept &&
    Number(r.sem) === sem &&
    (selectedCategory === "All" ||
     r.category === selectedCategory) &&
    (r.title + " " + r.subject + " " + r.category)
      .toLowerCase().includes(query)
  );

  if(filtered.length === 0){
    const empty = createText(
      "div",
      "No resources have been added for this selection yet.",
      "empty"
    );

    const syllabusMessage = createText(
      "p",
      "You can still check the department syllabus using the link above."
    );

    empty.appendChild(syllabusMessage);
    resourceList.appendChild(empty);
    return;
  }

  filtered.forEach(r => {
    const card = document.createElement("article");
    card.className = "resource";

    card.appendChild(createText("h3", "📄 " + r.title));
    card.appendChild(createText("p", "Subject: " + r.subject));

    card.appendChild(createText(
      "p",
      r.category + " • " + r.type +
      " • Semester " + r.sem,
      "meta"
    ));

    if(r.url && /^https?:\/\//i.test(r.url)){
      const link = document.createElement("a");
      link.className = "download";
      link.href = r.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Open / Download";
      card.appendChild(link);
    }else{
      card.appendChild(createText(
        "p",
        "File not added yet.",
        "meta"
      ));
    }

    resourceList.appendChild(card);
  });
}

document.getElementById("categoryTabs").addEventListener("click", event => {
  const button = event.target.closest("button[data-category]");
  if(!button) return;

  selectedCategory = button.dataset.category;

  document.querySelectorAll("#categoryTabs button").forEach(b => {
    b.classList.toggle("active", b === button);
  });

  showResources();
});

departmentSelect.addEventListener("change", showResources);
semesterSelect.addEventListener("change", showResources);
searchInput.addEventListener("input", showResources);

document.getElementById("searchButton").addEventListener("click", showResources);

const params = new URLSearchParams(window.location.search);

if(departments[params.get("dept")]){
  departmentSelect.value = params.get("dept");
}

const initialSemester = Number(params.get("sem"));

if(initialSemester >= 1 && initialSemester <= 8){
  semesterSelect.value = String(initialSemester);
}

showResources();
</script>

</body>
</html>
